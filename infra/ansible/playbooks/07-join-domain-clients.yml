---
# ==============================================================================
# NTL-SysToolbox — Join Windows clients to ntl.local domain
# ==============================================================================
# Prerequisites:
#   - DC01 promoted and running
#   - Windows clients installed with WinRM enabled
#   - SRV-FILES already domain-joined (via 04-configure-srvfiles.yml)
#
# Targets: PC-SIEGE-01, PC-ENTREPOT-01
#
# Usage:
#   ansible-playbook playbooks/07-join-domain-clients.yml --ask-vault-pass
# ==============================================================================

- name: Join Windows clients to ntl.local domain
  hosts:
    - PC-SIEGE-01
    - PC-ENTREPOT-01
  gather_facts: false

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vault.yml

  vars:
    ansible_user: "Administrateur"
    ansible_password: "{{ vault_windows_admin_password }}"

  tasks:
    - name: Wait for WinRM to be available
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    # ------------------------------------------------------------------
    # Step 1: Configure static IP + DNS towards DC01
    # ------------------------------------------------------------------
    - name: Configure static IP and DNS
      ansible.windows.win_powershell:
        script: |
          $adapter = Get-NetAdapter | Where-Object { $_.Status -eq "Up" } | Select-Object -First 1
          # Set DNS to DC01
          Set-DnsClientServerAddress -InterfaceIndex $adapter.ifIndex -ServerAddresses "192.168.10.10"
          # Verify current IP
          $current = (Get-NetIPAddress -InterfaceIndex $adapter.ifIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue).IPAddress
          $Ansible.Result = @{ current_ip = $current; adapter = $adapter.Name }

    # ------------------------------------------------------------------
    # Step 2: Check and join domain
    # ------------------------------------------------------------------
    - name: Check domain membership
      ansible.windows.win_powershell:
        script: |
          $cs = Get-WmiObject Win32_ComputerSystem
          $Ansible.Result = @{ domain = $cs.Domain; in_domain = $cs.PartOfDomain }
      register: domain_check

    - name: Join domain ntl.local
      ansible.windows.win_powershell:
        script: |
          $pwd = ConvertTo-SecureString "{{ vault_windows_admin_password }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential("NTL\Administrateur", $pwd)
          Add-Computer -DomainName "{{ domain_name }}" -Credential $cred -OUPath "OU=NTL-Computers,DC=ntl,DC=local" -Force
      when: not (domain_check.result.in_domain | default(false))
      register: join_result

    # ------------------------------------------------------------------
    # Step 3: Reboot after domain join
    # ------------------------------------------------------------------
    - name: Reboot after domain join
      ansible.windows.win_reboot:
        reboot_timeout: 300
      when: join_result is changed

    - name: Wait for WinRM after reboot
      ansible.builtin.wait_for_connection:
        timeout: 300
      when: join_result is changed

    # ------------------------------------------------------------------
    # Step 4: Verify domain membership
    # ------------------------------------------------------------------
    - name: Verify domain membership
      ansible.windows.win_powershell:
        script: |
          $cs = Get-WmiObject Win32_ComputerSystem
          $Ansible.Result = @{
            hostname = $cs.Name
            domain = $cs.Domain
            in_domain = $cs.PartOfDomain
          }
      register: verify_result

    - name: Show domain join status
      ansible.builtin.debug:
        msg: "{{ verify_result.result.hostname }} — Domain: {{ verify_result.result.domain }} (joined: {{ verify_result.result.in_domain }})"
