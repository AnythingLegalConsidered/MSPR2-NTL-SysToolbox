[tool.ruff]
target-version = "py310"
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "C"]
ignore = [
    "S603",  # subprocess call with shell=false (expected for mysqldump)
    "S608",  # SQL with string formatting (validated by regex)
    "S607",  # start process with partial path
    "S108",  # hardcoded tmp directory
    "S310",  # suspicious URL usage (urlopen in network utils — intended)
    "S507",  # paramiko AutoAddPolicy (lab environment, not prod)
    "C901",  # too complex (some functions are inherently complex)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # assert is expected in tests

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
